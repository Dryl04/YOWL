<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOWL - Paramètres</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>YOWL</h1>
        <p>Commenter le web de manière collaborative</p>
    </div>
    
    <div class="content">
        <div id="status-message" class="status hidden"></div>

        <div id="user-section" class="section hidden">
            <div class="user-info">
                <h4 id="user-name">Utilisateur connecté</h4>
                <p id="user-email"></p>
            </div>
            <button id="logout-btn" class="btn btn-secondary">Se déconnecter</button>
        </div>

        <div id="login-section" class="section">
            <h3 id="form-title">Connexion</h3>

            <div id="login-form">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" placeholder="Votre mot de passe">
                </div>
                <button id="login-btn" class="btn btn-primary">Se connecter</button>
                <button id="show-register-btn" class="btn btn-secondary">Créer un compte</button>
            </div>

            <div id="register-form" class="hidden">
                <div class="form-group">
                    <label for="register-name">Nom complet :</label>
                    <input type="text" id="register-name" placeholder="Votre nom complet">
                </div>
                <div class="form-group">
                    <label for="register-email">Email :</label>
                    <input type="email" id="register-email" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe :</label>
                    <input type="password" id="register-password" placeholder="Min. 8 caractères">
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Confirmer le mot de passe :</label>
                    <input type="password" id="register-password-confirm" placeholder="Répétez le mot de passe">
                </div>
                <div class="form-group">
                    <label for="register-birthdate">Date de naissance :</label>
                    <input type="date" id="register-birthdate">
                </div>
                <button id="register-btn" class="btn btn-primary">S'inscrire</button>
                <button id="show-login-btn" class="btn btn-secondary">Retour à la connexion</button>
            </div>
        </div>

        <div class="section">
            <h3>Paramètres</h3>
            <div class="toggle-section">
                <div>
                    <strong>Extension activée</strong>
                    <p style="margin: 4px 0 0 0; font-size: 12px; color: #666;">Permet d'afficher les commentaires YOWL</p>
                </div>
                <div class="toggle active" id="extension-toggle"></div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>YOWL v0.1.0</p>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
