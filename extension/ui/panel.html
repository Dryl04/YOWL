<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOWL - Commentaires</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div class="yowl-panel">
        <div class="panel-header">
            <div class="header-content">
                <h2>YOWL</h2>
                <button id="close-btn" class="close-btn">×</button>
            </div>
            <div class="url-info">
                <span id="current-url"></span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="comments">Commentaires</button>
            <button class="tab-btn" data-tab="add">Ajouter</button>
        </div>

        <div class="tab-content">
            <div id="comments-tab" class="tab-panel active">
                <div class="comments-container">
                    <div id="comments-list" class="comments-list">
                        <div class="loading">Chargement des commentaires...</div>
                    </div>
                </div>
            </div>

            <div id="add-tab" class="tab-panel">
                <div class="add-comment-form">
                    <div class="form-group">
                        <label for="comment-text">Votre commentaire :</label>
                        <textarea id="comment-text" placeholder="Écrivez votre commentaire ici..." rows="4"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="comment-scope">Portée :</label>
                        <select id="comment-scope">
                            <option value="page">Toute la page</option>
                            <option value="selection">Sélection actuelle</option>
                            <option value="site">Site entier</option>
                        </select>
                    </div>
                    
                    
                    <div class="form-actions">
                        <button id="submit-comment" class="submit-btn">Publier</button>
                        <button id="cancel-comment" class="cancel-btn">Annuler</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div id="status-message"></div>
            <div class="user-info">
                <span id="user-status">Non connecté</span>
            </div>
        </div>
    </div>

    <script src="panel.js"></script>
</body>
</html>
